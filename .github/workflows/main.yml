name: Build and Deploy Spring Boot API with Docker Compose

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build com Maven
        run: mvn clean package -DskipTests

      - name: Criar chave SSH temporária
        run: |
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > private_key.pem
          chmod 600 private_key.pem

      - name: Copiar arquivos para VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: "./private_key.pem"
          source: "."
          target: "~/app"

      - name: Deploy Docker Compose na VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key_path: "./private_key.pem"
          script: |
            cd /home/${{ secrets.VM_USER }}/app
            echo "==== Subindo container via Docker Compose ===="
            sudo docker-compose down || true
            sudo docker-compose up -d --build
            echo "✅ Deploy finalizado!"

      - name: Limpar chave temporária
        if: always()
        run: rm -f private_key.pem
