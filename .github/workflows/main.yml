name: Build and Deploy Spring Boot API to Azure VM

on:
  push:
    branches: [ "main" ] # dispara o deploy apenas em pushes na main
  workflow_dispatch: # permite executar manualmente o pipeline

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Faz checkout do código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2️⃣ Configura o JDK
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # pode ser adopt, temurin, zulu, etc.
          java-version: '21'

      # 3️⃣ Compila e empacota o projeto
      - name: Compilar projeto com Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Armazena o .jar gerado como artefato (opcional)
      - name: Upload artefato gerado
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

      # 5️⃣ Copia o .jar para a VM no Azure via SSH/SCP
      - name: Build e Deploy Docker na VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: "130.107.74.13"
          username: "kaique-ssh"
          key_path: "./id_rsa_azure.pem"
          script: |
            cd /home/kaique-ssh/app
            docker stop api-springboot || true
            docker rm api-springboot || true
            docker build -t api-springboot:latest .
            docker run -d --name api-springboot -p 8080:8080 api-springboot:latest
