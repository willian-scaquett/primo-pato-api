name: Build and Deploy Spring Boot API with Docker Compose
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4
      
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Build com Maven
        run: mvn clean package -DskipTests
      
      - name: Copiar arquivos para VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }} 
          source: "target/*.jar,docker-compose.yml,Dockerfile"
          target: "~/app"
          strip_components: 0

      - name: Deploy Docker Compose na VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/app
            echo "==== Criando .env ===="
            cat <<EOF > .env
            DB_URL=${{ secrets.DB_URL }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            EOF

            echo "==== Subindo container via Docker Compose ===="
            sudo docker-compose down || true
            sudo docker-compose up -d --build
            echo "Deploy finalizado!"
