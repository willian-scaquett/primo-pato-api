name: Build and Deploy Spring Boot API to Azure VM

on:
  push:
    branches: [ "main" ] # dispara o deploy apenas em pushes na main
  workflow_dispatch: # permite executar manualmente o pipeline

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Faz checkout do código
    - name: Checkout código
      uses: actions/checkout@v4

    # 2️⃣ Configura o JDK
    - name: Configurar JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin' # pode ser adopt, temurin, zulu, etc.
        java-version: '21'

    # 3️⃣ Compila e empacota o projeto
    - name: Compilar projeto com Maven
      run: mvn clean package -DskipTests

    # 4️⃣ Armazena o .jar gerado como artefato (opcional)
    - name: Upload artefato gerado
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar

    # 5️⃣ Copia o .jar para a VM no Azure via SSH/SCP
    - name: Copiar artefato para a VM Azure
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.AZURE_VM_IP }}          # IP público da sua VM
        username: ${{ secrets.AZURE_VM_USER }}    # usuário da VM
        key: ${{ secrets.AZURE_SSH_KEY }}         # chave privada SSH (ver instruções abaixo)
        source: "target/*.jar"
        target: "/home/${{ secrets.AZURE_VM_USER }}/app" # pasta destino na VM

    # 6️⃣ Conecta na VM e reinicia a aplicação
    - name: Reiniciar API na VM
      uses: appleboy/ssh-action@v1.1.0
      with:
        host: ${{ secrets.AZURE_VM_IP }}
        username: ${{ secrets.AZURE_VM_USER }}
        key: ${{ secrets.AZURE_SSH_KEY }}
        script: |
          echo "Parando aplicação anterior..."
          pkill -f 'java -jar' || true
          echo "Iniciando nova versão..."
          nohup java -jar /home/${{ secrets.AZURE_VM_USER }}/app/*.jar > app.log 2>&1 &
          echo "API iniciada com sucesso!"
