name: Build and Deploy Spring Boot API with Docker

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout do código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2️⃣ Configura o JDK 21
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Compila e empacota o projeto
      - name: Build com Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Build da imagem Docker no Actions
      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile           # Caminho para seu Dockerfile
          push: false                  # Não envia para Docker Hub/GHCR, só build local
          tags: api-springboot:latest

      # 5️⃣ Copia a imagem Docker e o jar para a VM via SSH
      - name: Deploy Docker na VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: "130.107.74.13"
          username: "kaique-ssh"
          key_path: "./id_rsa_azure.pem"
          script: |
            echo "==== Parando container antigo (se existir) ===="
            sudo docker stop api-springboot || true
            sudo docker rm api-springboot || true
            
            echo "==== Carregando nova imagem ===="
            # Caso queira enviar a imagem, você poderia usar docker save + docker load
            # Mas nesse exemplo usamos o build direto no runner para simplificar
            
            echo "==== Subindo container ===="
            sudo docker run -d --name api-springboot -p 8080:8080 api-springboot:latest
            
            echo "✅ Deploy finalizado com sucesso!"
