name: Build and Deploy Spring Boot API to Azure VM

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Faz checkout do código
      - name: Checkout código
        uses: actions/checkout@v4

      # 2️⃣ Configura o JDK
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 3️⃣ Compila e empacota o projeto
      - name: Compilar projeto com Maven
        run: mvn clean package -DskipTests

      # 4️⃣ Copia o JAR + Dockerfile para a VM
      - name: Copiar artefatos para a VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: "130.107.74.13"
          username: "kaique-ssh"
          key_path: "./id_rsa_azure.pem"
          source: |
            target/*.jar
            Dockerfile
          target: "/home/kaique-ssh/app"

      # 5️⃣ Constrói e executa o container Docker na VM
      - name: Build e Deploy Docker na VM
        uses: appleboy/ssh-action@v1.1.0
        with:
          host: "130.107.74.13"
          username: "kaique-ssh"
          key_path: "./id_rsa_azure.pem"
          script: |
            cd /home/kaique-ssh/app
            
            echo "==== Reiniciando container existente (se houver) ===="
            sudo docker stop api-springboot || true
            sudo docker rm api-springboot || true

            echo "==== Construindo nova imagem Docker ===="
            sudo docker build -t api-springboot:latest .

            echo "==== Subindo container ===="
            sudo docker run -d --name api-springboot -p 8080:8080 api-springboot:latest

            echo "✅ Deploy finalizado com sucesso!"
